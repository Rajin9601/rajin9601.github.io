{% include viz/stepper.html %}
<figure>
<div class="vz" id="msel1">
  <div class="vz-head">
    <span class="vz-stepno" data-vz="stepno"></span>
    <span class="vz-status" data-vz="status"></span>
  </div>

  <svg viewBox="0 0 760 290" role="img" aria-label="user variable 을 SELECT 만 할 때 Multiplexing 을 꺼지 않아도 되는 이유">
    <!-- links -->
    <path class="link" data-k="lx" d="M150 89 L 176 89"></path>
    <path class="link" data-k="ly" d="M150 219 L 176 219"></path>
    <path class="link" data-k="pd" d="M404 89 C 428 89, 426 58, 450 58"></path>
    <path class="link" data-k="pa" d="M404 219 C 428 219, 426 138, 450 138"></path>
    <path class="link" data-k="pb" d="M404 219 C 428 219, 426 190, 450 190"></path>
    <path class="link" data-k="pc" d="M404 219 C 428 219, 426 242, 450 242"></path>
    <path class="link" d="M640 58 C 655 58, 655 150, 670 150"></path>
    <path class="link" d="M640 138 L 670 150"></path>
    <path class="link" d="M640 190 L 670 150"></path>
    <path class="link" d="M640 242 C 655 242, 655 150, 670 150"></path>

    <!-- 앞단 연결 -->
    <rect class="box" data-k="fx" x="8" y="60" width="142" height="58" rx="8"></rect>
    <text class="t-tag" x="79" y="84" text-anchor="middle">앞단 연결 X</text>
    <text class="t-sub" x="79" y="104" text-anchor="middle" data-k="fxs">Multiplexing 꺼짐</text>
    <rect class="box" data-k="fy" x="8" y="190" width="142" height="58" rx="8"></rect>
    <text class="t-tag" x="79" y="214" text-anchor="middle">앞단 연결 Y</text>
    <text class="t-sub" x="79" y="234" text-anchor="middle" data-k="fys">Multiplexing 켜짐</text>

    <!-- proxy -->
    <rect class="box box-proxy" x="176" y="30" width="228" height="246" rx="10"></rect>
    <text class="t-title" x="290" y="58" text-anchor="middle">ProxySQL</text>
    <text class="t-hdr" x="290" y="104" text-anchor="middle">받은 query</text>
    <text class="t-mono" x="290" y="126" text-anchor="middle" data-k="q1"></text>
    <text class="t-mono" x="290" y="144" text-anchor="middle" data-k="q2"></text>
    <text class="t-note" x="290" y="182" text-anchor="middle" data-k="r1"></text>
    <text class="t-note" x="290" y="200" text-anchor="middle" data-k="r2"></text>
    <text class="t-tag" x="290" y="246" text-anchor="middle" data-k="res"></text>

    <!-- 뒷단 연결 -->
    <text class="t-hdr" x="545" y="28" text-anchor="middle">독점 배정된 뒷단 연결</text>
    <g class="fade" data-k="gd">
      <rect class="box box-own" x="450" y="38" width="190" height="40" rx="8"></rect>
      <text class="t-tag" x="464" y="55">연결 D</text>
      <text class="t-mono" x="464" y="70" style="fill:#2B8728">@order_id = 123</text>
      <text class="t-tag" x="628" y="55" text-anchor="end" style="fill:#2B8728">X 전용</text>
    </g>
    <text class="t-note fade" x="545" y="62" text-anchor="middle" data-k="gdx">연결 D 는 X 와 함께 사라짐</text>

    <text class="t-hdr" x="545" y="108" text-anchor="middle">공용 pool (Multiplexing)</text>
    <rect class="box" data-k="ca" x="450" y="118" width="190" height="40" rx="8"></rect>
    <text class="t-tag" x="464" y="135">연결 A</text>
    <text class="t-mono" x="464" y="150">@order_id = NULL</text>
    <rect class="box" data-k="cb" x="450" y="170" width="190" height="40" rx="8"></rect>
    <text class="t-tag" x="464" y="187">연결 B</text>
    <text class="t-mono" x="464" y="202" data-k="cbv">@order_id = NULL</text>
    <text class="t-tag fade" x="628" y="187" text-anchor="end" style="fill:#2B8728" data-k="cbo">Y 전용</text>
    <rect class="box" data-k="cc" x="450" y="222" width="190" height="40" rx="8"></rect>
    <text class="t-tag" x="464" y="239">연결 C</text>
    <text class="t-mono" x="464" y="254">@order_id = NULL</text>

    <!-- db -->
    <rect class="box" x="670" y="105" width="82" height="90" rx="10" style="fill:#f7f8f9;stroke:#8b9097"></rect>
    <text class="t-title" x="711" y="146" text-anchor="middle">MySQL</text>
    <text class="t-sub" x="711" y="166" text-anchor="middle">@order_id</text>
    <text class="t-sub" x="711" y="182" text-anchor="middle">없음</text>
  </svg>

  <p class="vz-desc" data-vz="desc"></p>

  <div class="vz-ctrl">
    <button type="button" data-vz="prev" aria-label="이전 단계">◀</button>
    <div class="vz-dots" data-vz="dots"></div>
    <button type="button" data-vz="next" aria-label="다음 단계">▶</button>
    <button type="button" class="vz-play" data-vz="play">▶ 자동 재생</button>
  </div>
</div>
<figcaption>Multiplexing 되는 뒷단 연결들은 항상 연결 초기값을 가지고 있다</figcaption>
</figure>

<script>
vzStepper({
  id: 'msel1',
  status: '',
  base: {
    lx: 'recv', pd: 'recv', ly: 'hide', pa: 'hide', pb: 'hide', pc: 'hide',
    fx: 'box-own', fxs: { f: '#2B8728' }, fys: { f: '#2563eb' },
    gdx: 'hide', cbo: 'hide'
  },
  steps: [
    { title: '시작',
      set: { q1: { t: 'SET @order_id' }, q2: { t: '= 123' }, r1: { t: 'user variable 변경' }, r2: { t: '→ X 의 Multiplexing 을 끔' } },
      desc: '앞단 연결 X 는 예전에 user variable 을 <b>변경</b>했기 때문에 Multiplexing 이 꺼졌고, 뒷단 연결 D 를 독점으로 쓰고 있습니다. 바뀐 값은 <b>D 에만</b> 있습니다. 공용 pool 에 있는 A, B, C 는 모두 연결 초기값입니다.' },

    { title: '값을 SELECT 만 하면',
      set: { lx: 'off', pd: 'off', ly: 'run', pa: 'run', fy: 'box-on',
             q1: { t: 'SELECT @order_id' }, q2: { t: '' },
             r1: { t: 'mysql_query_rules: multiplex = 2' }, r2: { t: '→ Multiplexing 유지' },
             res: { t: '결과: NULL (연결 초기값)', f: '#2563eb' } },
      desc: '앞단 연결 Y 가 user variable 을 <b>읽기만</b> 합니다. mysql_query_rules 때문에 Multiplexing 은 꺼지지 않고, 공용 pool 의 <b>연결 A</b> 로 갑니다.' },

    { title: '다른 뒷단 연결로 가도',
      set: { pa: 'hide', pc: 'run',
             res: { t: '결과: NULL (똑같음)', f: '#2563eb' } },
      desc: '같은 SELECT 가 이번에는 <b>연결 C</b> 로 갔습니다. 그래도 결과는 같습니다. 공용 pool 의 연결들은 <b>모두 같은 초기값</b>을 가지고 있기 때문에, 어느 연결로 가도 SELECT 결과는 바뀌지 않습니다.' },

    { title: '값을 변경하면',
      set: { pc: 'hide', ly: 'recv', pb: 'recv', fy: 'box-own', fys: { t: 'Multiplexing 꺼짐', f: '#2B8728' },
             cb: 'box-own', cbv: { t: '@order_id = 123', f: '#2B8728' }, cbo: '',
             q1: { t: 'SET @order_id' }, q2: { t: '= 123' },
             r1: { t: 'user variable 변경' }, r2: { t: '→ Y 의 Multiplexing 을 끔' },
             res: { t: '연결 B 를 Y 에 독점 배정', f: '#2B8728' } },
      desc: '이번에는 Y 가 user variable 을 <b>변경</b>했습니다. 이 때는 Multiplexing 이 꺼지고, 값이 바뀐 <b>연결 B 는 Y 만 쓰게 됩니다.</b> 그래서 바뀐 값이 다른 앞단 연결로 새지 않습니다.' },

    { title: '앞단 연결이 끊기면',
      set: { lx: 'hide', pd: 'hide', fx: 'box-dash', fxs: { t: '연결 끊김', f: '#9aa0a6' },
             gd: 'hide', gdx: '',
             q1: { t: '' }, q2: { t: '' }, r1: { t: '독점 배정된 뒷단 연결은' }, r2: { t: 'pool 로 돌아가지 않고 같이 닫힘' },
             res: { t: 'pool 에는 초기값만 남음', f: '#2B8728' } },
      tone: 'ok', status: 'SELECT 는 Multiplexing 유지해도 안전',
      desc: 'X 가 끊기면 독점 배정된 연결 D 도 <b>pool 로 돌아가지 않고 같이 닫힙니다.</b> 그래서 공용 pool 에는 항상 초기값을 가진 연결만 남고, <b>SELECT 만 하는 query 는 Multiplexing 을 꺼지 않아도 됩니다.</b>' }
  ]
});
</script>
