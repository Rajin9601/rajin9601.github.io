<style>
.mpx {
  --mpx-blue: #2563eb;
  --mpx-green: #2B8728;
  --mpx-red: #BA313B;
  --mpx-amber: #BA6C31;
  --mpx-grey: #9aa0a6;
  --mpx-line: #d7dade;
  border: 1px solid var(--mpx-line);
  border-radius: 10px;
  padding: 14px 16px 12px;
  background: #fff;
  letter-spacing: 0;
  text-align: left;
}
.mpx-modes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mpx-seg { display: flex; gap: 0; border: 1px solid var(--mpx-line); border-radius: 8px; overflow: hidden; }
.mpx-seg button {
  font: inherit; font-size: 12.5px; line-height: 1; font-weight: 500;
  border: 0; background: #fff; color: #6b7076;
  padding: 8px 12px; cursor: pointer; white-space: nowrap;
}
.mpx-seg button + button { border-left: 1px solid var(--mpx-line); }
.mpx-seg button:hover { background: #f7f8f9; }
.mpx-seg button[aria-pressed="true"] { background: #111; color: #fff; }
.mpx-status {
  font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  border: 1px solid currentColor; white-space: nowrap; color: var(--mpx-grey);
  margin-left: auto;
}
.mpx.is-bad .mpx-status { color: var(--mpx-red); background: #fdeeef; }
.mpx.is-good .mpx-status { color: var(--mpx-green); background: #eef6ed; }
.mpx-caption { font-size: 12px; color: #8b9097; margin: 8px 0 4px; }
.mpx-caption b { color: #444; font-weight: 600; }

.mpx svg { display: block; width: 100%; height: auto; }
.mpx text { font-family: inherit; fill: #111; }
.mpx .t-title { font-size: 14px; font-weight: 600; }
.mpx .t-sub { font-size: 11.5px; fill: #6b7076; }
.mpx .t-tag { font-size: 12px; font-weight: 600; }
.mpx .t-mono { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

.mpx .box { fill: #fff; stroke: var(--mpx-line); stroke-width: 1.5px; }
.mpx .box-proxy { fill: #fbfbfc; stroke: #8b9097; }
.mpx .box-db { fill: #f7f8f9; stroke: #8b9097; }
.mpx .chip { transition: opacity .3s; }
.mpx .chip rect { fill: #fff; stroke: var(--mpx-line); stroke-width: 1.5px; transition: stroke .3s, fill .3s; }
.mpx .chip.act rect { stroke: var(--mpx-blue); fill: #eff4fe; }
.mpx .chip.own rect { stroke: var(--mpx-green); fill: #eef6ed; }
.mpx .chip.dim { opacity: .3; }

.mpx .link { fill: none; stroke: var(--mpx-line); stroke-width: 2px; transition: opacity .3s, stroke .3s; }
.mpx .link.act { stroke: var(--mpx-blue); stroke-dasharray: 7 6; animation: mpx-flow .9s linear infinite; }
.mpx .link.own { stroke: var(--mpx-green); stroke-dasharray: 7 6; animation: mpx-flow .9s linear infinite; }
.mpx .link.dim { opacity: .22; }
@keyframes mpx-flow { from { stroke-dashoffset: 26; } to { stroke-dashoffset: 0; } }

.mpx .pill rect { fill: #eff4fe; stroke: var(--mpx-blue); stroke-width: 1px; }
.mpx .pill text { fill: #2563eb; }
.mpx .pill.off rect { fill: #eef6ed; stroke: var(--mpx-green); }
.mpx .pill.off text { fill: #2B6E27; }
.mpx .g-own { opacity: 0; transition: opacity .3s; }
.mpx.f-own .g-own { opacity: 1; }

.mpx-table { width: 100%; table-layout: fixed; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
.mpx-table th {
  text-align: left; font-weight: 600; color: #8b9097; font-size: 11px;
  padding: 4px 8px; border-bottom: 1px solid var(--mpx-line); white-space: nowrap;
}
.mpx-table td { padding: 7px 8px; border-bottom: 1px solid #f0f1f2; vertical-align: top; }
.mpx-table tr.idle td { opacity: .3; }
.mpx-table tr.now td { background: #f7f9fe; }
.mpx-table code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px; background: none; padding: 0; border: 0; color: #24292f;
  overflow-wrap: anywhere;
}
.mpx-conn { white-space: nowrap; font-weight: 600; }
.mpx-res { overflow-wrap: anywhere; }
.mpx-res.bad { color: var(--mpx-red); font-weight: 600; }
.mpx-res.good { color: var(--mpx-green); font-weight: 600; }
.mpx-res small { display: block; color: #8b9097; font-weight: 400; font-size: 11px; margin-top: 2px; }

.mpx-desc { font-size: 14px; line-height: 1.6; text-align: left; margin: 12px 0; min-height: 4.8em; }
.mpx-desc b { font-weight: 600; }
.mpx-ctrl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mpx-ctrl button {
  font: inherit; font-size: 13px; line-height: 1;
  border: 1px solid var(--mpx-line); background: #fff; color: #444;
  border-radius: 6px; padding: 7px 10px; cursor: pointer;
}
.mpx-ctrl button:hover { border-color: #b4b8bd; background: #f7f8f9; }
.mpx-ctrl button[disabled] { opacity: .4; cursor: default; }
.mpx-stepno { font-size: 12px; color: var(--mpx-grey); font-weight: 500; margin-right: 4px; }
.mpx-dots { display: flex; gap: 4px; margin: 0 4px; flex-wrap: wrap; }
.mpx-dots button { padding: 6px 9px; color: #888; }
.mpx-dots button[aria-current="true"] { background: #111; border-color: #111; color: #fff; }
.mpx-play { margin-left: auto; }

@media screen and (max-width: 600px) {
  .mpx { padding: 12px 10px 10px; }
  .mpx-seg button { padding: 8px 9px; font-size: 12px; }
  .mpx-status { margin-left: 0; }
  .mpx-table { font-size: 11.5px; }
  .mpx-desc { font-size: 13px; min-height: 7em; }
  .mpx-dots button { padding: 6px 7px; }
}
@media (prefers-reduced-motion: reduce) {
  .mpx .link.act, .mpx .link.own { animation: none; }
}
</style>

<figure>
<div class="mpx" id="mpx1">
  <div class="mpx-modes">

    <!-- proxy -->
    <rect class="box box-proxy" x="206" y="64" width="170" height="160" rx="10"></rect>
    <text class="t-title" x="291" y="96" text-anchor="middle">ProxySQL</text>

      <tr data-mpx="r1"><td><code>SET @order_id = 123;</code></td><td class="mpx-conn" data-mpx="r1c"></td><td class="mpx-res" data-mpx="r1v"></td></tr>
      <tr data-mpx="r2"><td><code>SELECT * FROM orders WHERE id = @order_id;</code></td><td class="mpx-conn" data-mpx="r2c"></td><td class="mpx-res" data-mpx="r2v"></td></tr>

<figcaption>같은 query 3개를, Multiplexing 설정만 바꿔서 비교하기</figcaption>

<script>
(function () {
  var root = document.getElementById('mpx1');
  if (!root) return;

  var UNSET = '@order_id = NULL';
  var SET = '@order_id = 123';
  var SPREAD = ['query 마다', '뒷단 연결을 배정'];
  var OWNED = ['앞단 연결 하나에', '뒷단 연결을 독점 배정'];

  var MODES = {
    on: {
      caption: '<b>가정</b> — 앞단 연결의 Multiplexing 이 끝까지 켜져 있다면',
      steps: [
        { mx: true, tz: [UNSET, UNSET, UNSET], act: null, note: SPREAD, rows: [null, null, null], now: -1,
          title: '시작',
          desc: '앞단 연결은 하나지만, Multiplexing 이 켜져 있으면 ProxySQL 은 <b>query 마다 뒷단 연결을 골라서</b> 보냅니다. user variable 은 DB 연결마다 따로 저장되고, 지금 뒷단 연결 A, B, C 에는 <code>@order_id</code> 가 없습니다.' },
        { mx: true, tz: [UNSET, UNSET, UNSET], act: 0, note: SPREAD, rows: [['연결 A', 'NULL', ''], null, null], now: 0,
          title: '① user variable 조회',
          desc: '첫 query 가 <b>뒷단 연결 A</b> 로 갔습니다. A 에는 아직 <code>@order_id</code> 가 없어서 NULL 이 돌아옵니다.' },
        { mx: true, tz: [UNSET, SET, UNSET], act: 1, note: SPREAD, rows: [['연결 A', 'NULL', ''], ['연결 B', 'OK', ''], null], now: 1,
          title: '② user variable 저장',
          desc: '두번째 query 는 <b>뒷단 연결 B</b> 로 갔습니다. 그래서 <b>연결 B 에만</b> <code>@order_id = 123</code> 이 저장됩니다. A 와 C 에는 여전히 없습니다.' },
        { mx: true, tz: [UNSET, SET, UNSET], act: 2, note: SPREAD, tone: 'bad',
          rows: [['연결 A', 'NULL', ''], ['연결 B', 'OK', ''], ['연결 C', '0 rows', 'bad']], now: 2,
          title: '③ user variable 로 조회',
          desc: '세번째 query 는 <b>뒷단 연결 C</b> 로 갔습니다. C 에서는 <code>@order_id</code> 가 NULL 이라서 아무 row 도 나오지 않습니다. <b>ProxySQL 이 없었다면 id 가 123 인 주문이 나왔어야 합니다.</b>' }
      ]
    },
    def: {
      caption: '<b>실제</b> — ProxySQL 기본 설정. <code>@</code> 가 들어간 query 가 오기만 해도 그 앞단 연결의 Multiplexing 을 끕니다',
      steps: [
        { mx: true, tz: [UNSET, UNSET, UNSET], act: null, note: SPREAD, rows: [null, null, null], now: -1,
          title: '시작',
          desc: '여기까지는 같습니다. 아직 <code>@</code> 가 들어간 query 가 오지 않았기 때문에 Multiplexing 은 켜져 있습니다.' },
        { mx: false, own: 0, tz: [UNSET, UNSET, UNSET], act: 0, note: OWNED, rows: [['연결 A', 'NULL', ''], null, null], now: 0,
          title: '① user variable 조회',
          desc: '첫 query 가 <b>뒷단 연결 A</b> 로 갑니다. ProxySQL 은 query 에 <code>@</code> 가 들어 있어서 user variable 을 쓴다는 것을 알기 때문에, <b>이 앞단 연결의 Multiplexing 을 끄고 연결 A 를 독점으로 배정합니다.</b>' },
        { mx: false, own: 0, tz: [SET, UNSET, UNSET], act: 0, note: OWNED, rows: [['연결 A', 'NULL', ''], ['연결 A', 'OK', ''], null], now: 1,
          title: '② user variable 저장',
          desc: '두번째 query 도 <b>같은 연결 A</b> 로 갑니다. 그래서 <code>@order_id = 123</code> 이 이 앞단 연결이 쓰는 바로 그 뒷단 연결에 저장됩니다.' },
        { mx: false, own: 0, tz: [SET, UNSET, UNSET], act: 0, note: OWNED, tone: 'good',
          rows: [['연결 A', 'NULL', ''], ['연결 A', 'OK', ''], ['연결 A', '1 row (id = 123)', 'good']], now: 2,
          title: '③ user variable 로 조회',
          desc: '세번째 query 도 <b>같은 연결 A</b> 로 가서, ProxySQL 이 없을 때와 똑같이 id 가 123 인 주문이 나옵니다. 대신 이 뒷단 연결은 앞단 연결이 사라질 때까지 묶여 있어서, <b>Switchover 때 draining 이 되지 않습니다.</b>' }
      ]
    }
  };

  var el = {};
  var keys = ['status', 'caption', 'desc', 'stepno', 'prev', 'next', 'play', 'dots',
              'pmx', 'pmxt', 'pn0', 'pn1', 'lc', 'own', 'mode-on', 'mode-def'];
  [0, 1, 2].forEach(function (i) {
    keys.push('c' + i, 'c' + i + 'v', 'lp' + i, 'ld' + i, 'r' + i, 'r' + i + 'c', 'r' + i + 'v');
  });
  keys.forEach(function (k) { el[k] = root.querySelector('[data-mpx="' + k + '"]'); });

  var mode = 'on';
  var cur = 0;
  var timer = null;

  var dots = MODES.on.steps.map(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(i + 1);
    b.addEventListener('click', function () { stop(); render(i); });
    el.dots.appendChild(b);
    return b;
  });

  function render(i) {
    var steps = MODES[mode].steps;
    cur = (i + steps.length) % steps.length;
    var s = steps[cur];
    var owned = typeof s.own === 'number';

    root.classList.toggle('f-own', owned);
    root.classList.toggle('is-bad', s.tone === 'bad');
    root.classList.toggle('is-good', s.tone === 'good');
    if (owned) el.own.setAttribute('transform', 'translate(0,' + (85 * s.own) + ')');

    el['mode-on'].setAttribute('aria-pressed', mode === 'on' ? 'true' : 'false');
    el['mode-def'].setAttribute('aria-pressed', mode === 'def' ? 'true' : 'false');
    el.caption.innerHTML = MODES[mode].caption;

    el.pmx.setAttribute('class', 'pill' + (s.mx ? '' : ' off'));
    el.pmxt.textContent = s.mx ? 'Multiplexing 켜짐' : 'Multiplexing 꺼짐';
    el.pn0.textContent = s.note[0];
    el.pn1.textContent = s.note[1];

    var flow = owned ? 'own' : 'act';
    el.lc.setAttribute('class', 'link ' + (s.act === null ? '' : flow));

    [0, 1, 2].forEach(function (n) {
      var on = s.act === n;
      var muted = owned && n !== s.own;
      el['c' + n].setAttribute('class', 'chip' + (on ? ' ' + flow : '') + (muted ? ' dim' : ''));
      el['c' + n + 'v'].textContent = s.tz[n];
      el['c' + n + 'v'].setAttribute('fill', s.tz[n] === UNSET ? '#6b7076' : '#2B8728');
      el['lp' + n].setAttribute('class', 'link ' + (on ? flow : (muted ? 'dim' : '')));
      el['ld' + n].setAttribute('class', 'link ' + (on ? flow : (muted ? 'dim' : '')));

      var r = s.rows[n];
      el['r' + n].className = r ? (s.now === n ? 'now' : '') : 'idle';
      el['r' + n + 'c'].textContent = r ? r[0] : '—';
      el['r' + n + 'c'].style.color = r ? (owned ? '#2B8728' : '#2563eb') : '#9aa0a6';
      el['r' + n + 'v'].className = 'mpx-res' + (r && r[2] ? ' ' + r[2] : '');
      if (r && r[2] === 'bad') {
        el['r' + n + 'v'].innerHTML = r[1] + '<small>기대한 값: 1 row (id = 123)</small>';
      } else {
        el['r' + n + 'v'].textContent = r ? r[1] : '';
      }
    });

    el.stepno.textContent = 'STEP ' + (cur + 1) + ' / ' + steps.length;
    el.status.textContent = s.tone === 'bad' ? '결과가 다름' : (s.tone === 'good' ? '결과 정상' : (s.mx ? 'Multiplexing 켜짐' : 'Multiplexing 꺼짐'));
    el.desc.innerHTML = '<b>' + s.title + '</b> — ' + s.desc;

    dots.forEach(function (b, n) {
      b.setAttribute('aria-current', n === cur ? 'true' : 'false');
      b.setAttribute('aria-label', (n + 1) + '단계: ' + steps[n].title);
    });
    el.prev.disabled = cur === 0;
    el.next.disabled = cur === steps.length - 1;
  }

  function setMode(m) { stop(); mode = m; render(0); }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    el.play.textContent = '▶ 자동 재생';
  }

  el['mode-on'].addEventListener('click', function () { setMode('on'); });
  el['mode-def'].addEventListener('click', function () { setMode('def'); });
  el.prev.addEventListener('click', function () { stop(); render(cur - 1); });
  el.next.addEventListener('click', function () { stop(); render(cur + 1); });
  el.play.addEventListener('click', function () {
    if (timer) { stop(); return; }
    var last = MODES[mode].steps.length - 1;
    if (cur === last) render(0);
    el.play.textContent = '❚❚ 정지';
    timer = setInterval(function () {
      if (cur === MODES[mode].steps.length - 1) { stop(); return; }
      render(cur + 1);
    }, 2600);
  });

  render(0);
})();
</script>
